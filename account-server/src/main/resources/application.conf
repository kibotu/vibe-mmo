ktor {
    deployment {
        port = 28080
        host = "0.0.0.0"
    }
    application {
        modules = [ net.kibotu.ro.account.ApplicationKt.module ]
    }
    
    # JWT Configuration
    jwt {
        secret = "your-secret-key-change-in-production-min-256-bits"
        issuer = "ragnarok-account-server"
        audience = "ragnarok-clients"
        expirationHours = 24
    }
    
    # Database Configuration
    database {
        # Development: H2 file-based database (required for database viewer)
        driver = "org.h2.Driver"
        url = "jdbc:h2:file:./data/accountdb;AUTO_SERVER=TRUE;MODE=PostgreSQL"
        # For in-memory database (won't work with database viewer):
        # url = "jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
        user = "sa"
        password = ""
        
        # Enable H2 console for debugging (access at http://localhost:28080/h2-console)
        # Note: H2 console only works with file-based databases, not in-memory
        # To use H2 console, change URL above to file-based format
        
        # Production: Uncomment and configure PostgreSQL
        # driver = "org.postgresql.Driver"
        # url = "jdbc:postgresql://localhost:5432/ragnarok"
        # user = "ragnarok_user"
        # password = "secure_password"
    }
}

