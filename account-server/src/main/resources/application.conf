ktor {
    deployment {
        port = 28080
        host = "0.0.0.0"
    }
    application {
        modules = [ net.kibotu.ro.account.ApplicationKt.module ]
    }
    
    # JWT Configuration
    jwt {
        secret = "your-secret-key-change-in-production-min-256-bits"
        issuer = "ragnarok-account-server"
        audience = "ragnarok-clients"
        expirationHours = 24
    }
    
    # Database Configuration
    database {
        # Development: H2 in-memory database
        driver = "org.h2.Driver"
        url = "jdbc:h2:mem:accountdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
        user = "sa"
        password = ""
        
        # Production: Uncomment and configure PostgreSQL
        # driver = "org.postgresql.Driver"
        # url = "jdbc:postgresql://localhost:5432/ragnarok"
        # user = "ragnarok_user"
        # password = "secure_password"
    }
}

