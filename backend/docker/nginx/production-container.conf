server {
    listen 8080;
    server_name _;
    root /var/www/html/backend/public;
    index lobby.php;

    server_tokens off;
    client_max_body_size 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = / {
        rewrite ^ /lobby.php last;
    }

    location = /game {
        return 301 /game/;
    }

    location /game/ {
        index index.html;
        try_files $uri $uri/ /game/index.html;
    }

    location = /ws {
        set $php_upstream http://php:8080;
        proxy_pass $php_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        access_log off;
    }

    location ~* ^/(?:bin|database|docker|runtime|src|tests|vendor)(?:/|$) {
        deny all;
    }

    location ~* ^/(?:composer\.(?:json|lock)|secrets\.ya?ml(?:\.example)?)(?:$|/) {
        deny all;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_PROXY "";
        set $php_fpm_upstream php:9000;
        fastcgi_pass $php_fpm_upstream;
        fastcgi_read_timeout 30s;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(?:bak|conf|dist|ini|log|sh|sql|swp|yaml|yml)$ {
        deny all;
    }
}
