# Local Docker development overrides.
#
# backend/secrets.yml holds the shared values that are identical in both
# runtimes: database name, user, password, prefix, room limits, FTP settings.
# Only a few values differ, and they differ because the deployment topology
# differs, not because the application is configured differently:
#
#   database.host    db         the MariaDB service name inside the Compose
#                               network; "localhost" there resolves to the php
#                               container itself and no socket exists
#   database.*_port  3306       the in-network port
#
# The FTP host runs PHP and MySQL on the same machine, so its copy of
# secrets.yml uses "localhost" and no overrides are needed.
#
# deploy.sh never uploads this file. It uploads only secrets.yml.

database:
  host: "db"
  host_port: 3306
