ktor {
    deployment {
        port = 8081
        host = "0.0.0.0"
    }
    application {
        modules = [ net.kibotu.ro.character.ApplicationKt.module ]
    }
    
    # Account Server URL for session validation
    accountServer {
        url = "http://localhost:8080"
    }
    
    # Database Configuration
    database {
        # Development: H2 in-memory database
        driver = "org.h2.Driver"
        url = "jdbc:h2:mem:characterdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL"
        user = "sa"
        password = ""
        
        # Production: Uncomment and configure PostgreSQL
        # driver = "org.postgresql.Driver"
        # url = "jdbc:postgresql://localhost:5432/ragnarok"
        # user = "ragnarok_user"
        # password = "secure_password"
    }
}

