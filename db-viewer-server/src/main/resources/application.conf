ktor {
    deployment {
        port = 28083
        host = "0.0.0.0"
    }
    application {
        modules = [ net.kibotu.ro.dbviewer.ApplicationKt.module ]
    }
    
    # Database connections to other servers
    # IMPORTANT: These must match the database URLs used by account-server and character-server
    # For in-memory databases, the viewer won't work across different processes.
    # Use file-based databases for the viewer to work properly.
    databases {
        account {
            driver = "org.h2.Driver"
            # Path must match account-server's database path
            # Account-server creates database at: account-server/data/accountdb
            # When run via Gradle, working directory is project root, so use ./ prefix
            url = "jdbc:h2:file:./account-server/data/accountdb;AUTO_SERVER=TRUE;MODE=PostgreSQL"
            user = "sa"
            password = ""
        }
        
        character {
            driver = "org.h2.Driver"
            # Path must match character-server's database path
            # Character-server creates database at: character-server/data/characterdb
            # When run via Gradle, working directory is project root, so use ./ prefix
            url = "jdbc:h2:file:./character-server/data/characterdb;AUTO_SERVER=TRUE;MODE=PostgreSQL"
            user = "sa"
            password = ""
        }
    }
    
    # Server URLs for zone server state
    servers {
        accountServer {
            url = "http://localhost:28080"
        }
        characterServer {
            url = "http://localhost:28081"
        }
        zoneServer {
            url = "http://localhost:28082"
        }
    }
}

