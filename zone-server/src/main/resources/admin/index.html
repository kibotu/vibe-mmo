<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Server Admin Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #f59e0b;
            --primary-dark: #d97706;
            --secondary: #ef4444;
            --success: #10b981;
            --danger: #ef4444;
            --warning: #f59e0b;
            --info: #3b82f6;
            --dark: #1f2937;
            --light: #f9fafb;
            --border: #e5e7eb;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #f59e0b 0%, #ef4444 50%, #ec4899 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: var(--dark);
        }
        
        .container {
            max-width: 1600px;
            margin: 0 auto;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .header h1 {
            font-size: 32px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .header p {
            color: #6b7280;
            font-size: 16px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            transform: scaleX(0);
            transition: transform 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-lg);
        }
        
        .stat-card:hover::before {
            transform: scaleX(1);
        }
        
        .stat-card h3 {
            color: #6b7280;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .stat-card .value {
            font-size: 36px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: var(--shadow-lg);
            border: 1px solid rgba(255, 255, 255, 0.2);
            animation: slideUp 0.5s ease-out;
            margin-bottom: 24px;
        }
        
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .panel h2 {
            font-size: 24px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 3px solid;
            border-image: linear-gradient(90deg, var(--primary), var(--secondary)) 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .zone-card {
            background: #f9fafb;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            border: 2px solid var(--border);
            transition: all 0.2s;
        }
        
        .zone-card:hover {
            border-color: var(--primary);
            box-shadow: var(--shadow);
        }
        
        .zone-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        
        .zone-name {
            font-size: 20px;
            font-weight: 700;
            color: var(--dark);
        }
        
        .zone-stats {
            display: flex;
            gap: 16px;
            font-size: 14px;
            color: #6b7280;
        }
        
        .zone-stats span {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .players-list {
            margin-top: 12px;
        }
        
        .player-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        
        .player-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .player-name {
            font-weight: 600;
            color: var(--dark);
        }
        
        .player-position {
            font-size: 12px;
            color: #9ca3af;
            font-family: 'Courier New', monospace;
        }
        
        .table-container {
            overflow-x: auto;
            max-height: 600px;
            overflow-y: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: linear-gradient(135deg, #f9fafb 0%, #f3f4f6 100%);
            padding: 16px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            position: sticky;
            top: 0;
            z-index: 10;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid var(--border);
        }
        
        td {
            padding: 16px;
            border-bottom: 1px solid var(--border);
            transition: background 0.2s;
        }
        
        tr:hover {
            background: #f9fafb;
        }
        
        .btn {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
            margin: 2px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: var(--danger);
            color: white;
        }
        
        .btn-danger:hover:not(:disabled) {
            background: #dc2626;
            transform: translateY(-1px);
            box-shadow: 0 4px 6px rgba(239, 68, 68, 0.3);
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }
        
        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }
        
        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            border-left: 4px solid var(--danger);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .refresh-btn {
            background: var(--primary);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: var(--shadow);
        }
        
        .refresh-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-1px);
            box-shadow: var(--shadow-lg);
        }
        
        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: white;
            padding: 16px 24px;
            border-radius: 12px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 1000;
            animation: slideInRight 0.3s ease-out;
            min-width: 300px;
            border-left: 4px solid;
        }
        
        .toast.success {
            border-left-color: var(--success);
        }
        
        .toast.error {
            border-left-color: var(--danger);
        }
        
        @keyframes slideInRight {
            from {
                transform: translateX(400px);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #9ca3af;
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.5;
        }
        
        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.6s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .badge-info {
            background: #dbeafe;
            color: #1e40af;
        }
        
        .badge-type {
            background: #fef3c7;
            color: #92400e;
        }
        
        .npc-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid var(--border);
        }
        
        .npc-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .npc-name {
            font-weight: 600;
            color: var(--dark);
        }
        
        .npc-position {
            font-size: 12px;
            color: #9ca3af;
            font-family: 'Courier New', monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>
                <span>🗺️</span>
                Zone Server Admin Panel
            </h1>
            <p>Monitor active zones, players, and manage zone instances in real-time</p>
        </div>
        
        <div class="stats-grid" id="statsGrid">
            <div class="stat-card">
                <h3>Active Zones</h3>
                <div class="value" id="totalZones">-</div>
            </div>
            <div class="stat-card">
                <h3>Players Online</h3>
                <div class="value" id="totalPlayers">-</div>
            </div>
            <div class="stat-card">
                <h3>Total NPCs</h3>
                <div class="value" id="totalNPCs">-</div>
            </div>
            <div class="stat-card">
                <h3>Total Monsters</h3>
                <div class="value" id="totalMonsters">-</div>
            </div>
        </div>
        
        <div class="panel">
            <h2>
                <span>Active Zones</span>
                <button class="refresh-btn" onclick="loadZones()" id="zonesRefreshBtn">
                    <span>🔄</span>
                    <span>Refresh</span>
                </button>
            </h2>
            <div id="zonesError"></div>
            <div id="zonesLoading" class="loading">Loading zones</div>
            <div id="zonesContainer" style="display: none;"></div>
        </div>
        
        <div class="panel">
            <h2>
                <span>NPCs by Zone</span>
                <button class="refresh-btn" onclick="loadNPCs()" id="npcsRefreshBtn">
                    <span>🔄</span>
                    <span>Refresh</span>
                </button>
            </h2>
            <div id="npcsError"></div>
            <div id="npcsLoading" class="loading">Loading NPCs</div>
            <div id="npcsContainer" style="display: none;"></div>
        </div>
    </div>
    
    <script>
        const API_BASE = '/api/admin';
        
        function showToast(message, type = 'success') {
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icons = {
                success: '✅',
                error: '❌',
                warning: '⚠️'
            };
            toast.innerHTML = `
                <span class="toast-icon">${icons[type] || icons.success}</span>
                <span>${message}</span>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                toast.style.animation = 'slideInRight 0.3s ease-out reverse';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
        
        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                const data = await response.json();
                if (!data.success) {
                    throw new Error(data.error || 'Request failed');
                }
                return data.data;
            } catch (error) {
                console.error('API Error:', error);
                throw error;
            }
        }
        
        async function deleteAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json().catch(() => {
                    return { success: false, error: `HTTP ${response.status}: ${response.statusText}` };
                });
                
                if (!response.ok) {
                    throw new Error(data.error || `HTTP ${response.status}: ${response.statusText}`);
                }
                
                if (!data.success) {
                    throw new Error(data.error || 'Delete failed');
                }
                
                return data;
            } catch (error) {
                console.error('Delete Error:', error);
                throw error;
            }
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        async function loadStatistics() {
            try {
                const stats = await fetchAPI('/statistics');
                document.getElementById('totalZones').textContent = stats.totalZones;
                document.getElementById('totalPlayers').textContent = stats.totalPlayers;
                document.getElementById('totalNPCs').textContent = stats.totalNPCs;
                document.getElementById('totalMonsters').textContent = stats.totalMonsters;
            } catch (error) {
                console.error('Failed to load statistics:', error);
            }
        }
        
        async function loadZones() {
            const loadingEl = document.getElementById('zonesLoading');
            const containerEl = document.getElementById('zonesContainer');
            const errorEl = document.getElementById('zonesError');
            const refreshBtn = document.getElementById('zonesRefreshBtn');
            
            loadingEl.style.display = 'block';
            containerEl.style.display = 'none';
            errorEl.innerHTML = '';
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<span class="spinner"></span><span>Loading...</span>';
            
            try {
                const zones = await fetchAPI('/zones');
                loadingEl.style.display = 'none';
                
                if (zones.length === 0) {
                    containerEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🗺️</div><div>No active zones</div></div>';
                    containerEl.style.display = 'block';
                } else {
                    containerEl.innerHTML = zones.map(zone => {
                        const playersHtml = zone.players.length > 0
                            ? zone.players.map(player => `
                                <div class="player-item">
                                    <div class="player-info">
                                        <span class="player-name">${escapeHtml(player.name)}</span>
                                        <span class="player-position">(${player.position.x}, ${player.position.y})</span>
                                        <span class="badge badge-info">${escapeHtml(player.direction)}</span>
                                    </div>
                                    <button class="btn btn-danger" onclick="kickPlayer('${escapeHtml(zone.id)}', '${escapeHtml(player.characterId)}', '${escapeHtml(player.name)}', event)" title="Kick player">
                                        🚪 Kick
                                    </button>
                                </div>
                            `).join('')
                            : '<div class="empty-state" style="padding: 20px;"><div>No players in this zone</div></div>';
                        
                        return `
                            <div class="zone-card">
                                <div class="zone-header">
                                    <div class="zone-name">${escapeHtml(zone.zoneName)}</div>
                                    <div class="zone-stats">
                                        <span>👥 ${zone.playerCount}</span>
                                        <span>🤖 ${zone.npcCount}</span>
                                        <span>👹 ${zone.monsterCount}</span>
                                    </div>
                                </div>
                                <div style="font-size: 11px; color: #9ca3af; margin-bottom: 12px; font-family: monospace;">
                                    Instance ID: ${escapeHtml(zone.id.substring(0, 8))}...
                                </div>
                                <div class="players-list">
                                    <strong style="display: block; margin-bottom: 8px; color: #6b7280;">Players:</strong>
                                    ${playersHtml}
                                </div>
                            </div>
                        `;
                    }).join('');
                    containerEl.style.display = 'block';
                }
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.innerHTML = `<div class="error">❌ Error: ${escapeHtml(error.message)}</div>`;
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<span>🔄</span><span>Refresh</span>';
            }
        }
        
        async function loadNPCs() {
            const loadingEl = document.getElementById('npcsLoading');
            const containerEl = document.getElementById('npcsContainer');
            const errorEl = document.getElementById('npcsError');
            const refreshBtn = document.getElementById('npcsRefreshBtn');
            
            loadingEl.style.display = 'block';
            containerEl.style.display = 'none';
            errorEl.innerHTML = '';
            refreshBtn.disabled = true;
            refreshBtn.innerHTML = '<span class="spinner"></span><span>Loading...</span>';
            
            try {
                const zones = await fetchAPI('/zones');
                loadingEl.style.display = 'none';
                
                if (zones.length === 0) {
                    containerEl.innerHTML = '<div class="empty-state"><div class="empty-state-icon">🤖</div><div>No active zones with NPCs</div></div>';
                    containerEl.style.display = 'block';
                } else {
                    containerEl.innerHTML = zones.map(zone => {
                        const npcsHtml = zone.npcs && zone.npcs.length > 0
                            ? zone.npcs.map(npc => `
                                <div class="npc-item">
                                    <div class="npc-info">
                                        <span class="npc-name">${escapeHtml(npc.name)}</span>
                                        <span class="npc-position">(${npc.position.x}, ${npc.position.y})</span>
                                        <span class="badge badge-type">${escapeHtml(npc.type)}</span>
                                    </div>
                                    <span style="font-size: 11px; color: #9ca3af; font-family: monospace;">${escapeHtml(npc.id)}</span>
                                </div>
                            `).join('')
                            : '<div class="empty-state" style="padding: 20px;"><div>No NPCs in this zone</div></div>';
                        
                        return `
                            <div class="zone-card">
                                <div class="zone-header">
                                    <div class="zone-name">${escapeHtml(zone.zoneName)}</div>
                                    <div class="zone-stats">
                                        <span>🤖 ${zone.npcCount || 0}</span>
                                    </div>
                                </div>
                                <div style="font-size: 11px; color: #9ca3af; margin-bottom: 12px; font-family: monospace;">
                                    Instance ID: ${escapeHtml(zone.id.substring(0, 8))}...
                                </div>
                                <div class="players-list">
                                    <strong style="display: block; margin-bottom: 8px; color: #6b7280;">NPCs:</strong>
                                    ${npcsHtml}
                                </div>
                            </div>
                        `;
                    }).join('');
                    containerEl.style.display = 'block';
                }
            } catch (error) {
                loadingEl.style.display = 'none';
                errorEl.innerHTML = `<div class="error">❌ Error: ${escapeHtml(error.message)}</div>`;
            } finally {
                refreshBtn.disabled = false;
                refreshBtn.innerHTML = '<span>🔄</span><span>Refresh</span>';
            }
        }
        
        async function kickPlayer(instanceId, characterId, name, event) {
            if (!confirm(`⚠️ Are you sure you want to kick "${name}" from this zone?\n\nThe player will be disconnected immediately.`)) {
                return;
            }
            
            const button = event ? event.target.closest('.btn') : document.querySelector(`button[onclick*="${characterId}"]`);
            if (!button) {
                showToast('Could not find button element', 'error');
                return;
            }
            
            const originalText = button.innerHTML;
            button.disabled = true;
            button.innerHTML = '<span class="spinner"></span> Kicking...';
            
            try {
                await deleteAPI(`/zones/${instanceId}/players/${characterId}`);
                showToast(`Player "${name}" kicked successfully`, 'success');
                await Promise.all([loadZones(), loadStatistics()]);
            } catch (error) {
                showToast(`Failed to kick player: ${error.message}`, 'error');
                button.disabled = false;
                button.innerHTML = originalText;
            }
        }
        
        window.addEventListener('DOMContentLoaded', () => {
            loadStatistics();
            loadZones();
            loadNPCs();
            
            setInterval(() => {
                loadStatistics();
                loadZones();
                loadNPCs();
            }, 10000);
        });
    </script>
</body>
</html>
