ktor {
    deployment {
        port = 8082
        host = "0.0.0.0"
    }
    application {
        modules = [ net.kibotu.ro.zone.ApplicationKt.module ]
    }
    
    # Account Server URL for session validation
    accountServer {
        url = "http://localhost:8080"
    }
    
    # Character Server URL for character validation
    characterServer {
        url = "http://localhost:8081"
    }
}

